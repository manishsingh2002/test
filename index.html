<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC CGL Exam Prep — Your Personal Examination Center</title>
    <meta name="description" content="AI-powered SSC CGL exam preparation platform. Import question papers, take exams, analyze performance, and learn from mistakes." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #f9fafb; color: #111827; }
      html.dark, html.dark body { background-color: #111827; color: #f3f4f6; }
    </style>
    <!-- SPA routing handler for GitHub Pages - MUST be in head before app loads -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
